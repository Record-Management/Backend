version: '3.8'

services:
  habitlog-db:
    image: mysql:8.0
    container_name: habitlog-db
    restart: always
    environment:
      TZ: Asia/Seoul
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - habitlog-network

  habitlog-app:
    build: .
    container_name: habitlog-app
    restart: always
    ports:
      - "8082:8082"
    depends_on:
      - habitlog-db
    networks:
      - habitlog-network
    environment:
      - TZ=Asia/Seoul
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=${SERVER_PORT}
      - SPRING_DATASOURCE_URL=jdbc:mysql://habitlog-db:3306/${DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=com.mysql.cj.jdbc.Driver
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_JPA_SHOW_SQL=true
      - SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=org.hibernate.dialect.MySQLDialect
      - SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL=true
      - SPRING_JPA_PROPERTIES_HIBERNATE_USE_SQL_COMMENTS=true
      - SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_BATCH_FETCH_SIZE=100
      - SPRING_JPA_OPEN_IN_VIEW=false
      - SERVER_COMPRESSION_ENABLED=true
      - SERVER_COMPRESSION_MIME_TYPES=application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
      - SERVER_TOMCAT_MAX_THREADS=200
      - SERVER_TOMCAT_MIN_SPARE_THREADS=10
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_TOKEN_EXPIRE_TIME=${JWT_ACCESS_TOKEN_EXPIRE_TIME}
      - JWT_REFRESH_TOKEN_EXPIRE_TIME=${JWT_REFRESH_TOKEN_EXPIRE_TIME}
      - OAUTH_KAKAO_REST_API_KEY=${KAKAO_CLIENT_REST_API_KEY}
      - OAUTH_KAKAO_ADMIN_KEY=${KAKAO_ADMIN_KEY}
      - SOCIAL_APPLE_TEAM_ID=${APPLE_TEAM_ID}
      - SOCIAL_APPLE_BUNDLE_ID=${APPLE_BUNDLE_ID}
      - SOCIAL_APPLE_KEY_ID=${APPLE_KEY_ID}
      - SOCIAL_APPLE_SERVICE_ID=${APPLE_SERVICE_ID}
      - SOCIAL_APPLE_PRIVATE_KEY_PATH=${APPLE_PRIVATE_KEY_PATH}
      - SOCIAL_APPLE_JWT_EXPIRATION_MINUTES=${APPLE_JWT_EXPIRATION_MINUTES}
      - SPRING_CLOUD_AWS_CREDENTIALS_ACCESS_KEY=${AWS_ACCESS_KEY}
      - SPRING_CLOUD_AWS_CREDENTIALS_SECRET_KEY=${AWS_SECRET_KEY}
      - SPRING_CLOUD_AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - SPRING_CLOUD_AWS_REGION_STATIC=${AWS_REGION}
      - LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB=${LOG_LEVEL_WEB}
      - LOGGING_LEVEL_ORG_HIBERNATE_SQL=${LOG_LEVEL_SQL}
      - LOGGING_LEVEL_ORG_HIBERNATE_TYPE=${LOG_LEVEL_TYPE}
      - SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE}
      - SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE}
      - SPRING_JACKSON_DESERIALIZATION_FAIL_ON_UNKNOWN_PROPERTIES=false
      - SPRING_JACKSON_SERIALIZATION_FAIL_ON_EMPTY_BEANS=false
      - SPRING_JACKSON_SERIALIZATION_WRITE_DATES_AS_TIMESTAMPS=false
      - SPRING_JACKSON_DEFAULT_PROPERTY_INCLUSION=non_null
      - SPRING_JACKSON_TIME_ZONE=Asia/Seoul
      - SPRING_JACKSON_PARSER_ALLOW_UNQUOTED_CONTROL_CHARS=true
      - SPRING_JACKSON_PARSER_ALLOW_BACKSLASH_ESCAPING_ANY_CHARACTER=true
      - SPRING_HTTP_ENCODING_CHARSET=UTF-8
      - SPRING_HTTP_ENCODING_ENABLED=true
      - SPRING_HTTP_ENCODING_FORCE=true
      - SPRING_MVC_THROW_EXCEPTION_IF_NO_HANDLER_FOUND=true
      - SPRING_WEB_RESOURCES_ADD_MAPPINGS=true
    volumes:
      - ${APPLE_PRIVATE_KEY_PATH}:/app/AuthKey_BR37FCMBWW.p8

volumes:
  mysql_data:

networks:
  habitlog-network:
    driver: bridge
