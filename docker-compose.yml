version: '3.8'

services:
  habitlog-db:
    image: mysql:8.0
    container_name: habitlog-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - habitlog-network

  habitlog-app:
    build: .
    container_name: habitlog-app
    restart: always
    ports:
      - "8082:8082"
    depends_on:
      - habitlog-db
    networks:
      - habitlog-network
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_TOKEN_EXPIRE_TIME=${JWT_ACCESS_TOKEN_EXPIRE_TIME}
      - JWT_REFRESH_TOKEN_EXPIRE_TIME=${JWT_REFRESH_TOKEN_EXPIRE_TIME}
      - oauth.kakao.rest-api-key=${KAKAO_CLIENT_REST_API_KEY}
      - oauth.kakao.admin-key=${KAKAO_ADMIN_KEY}
      - social.apple.team-id=${APPLE_TEAM_ID}
      - social.apple.bundle-id=${APPLE_BUNDLE_ID}
      - social.apple.key-id=${APPLE_KEY_ID}
      - social.apple.service-id=${APPLE_SERVICE_ID}
      - social.apple.private-key-path=${APPLE_PRIVATE_KEY_PATH}
      - social.apple.jwt-expiration-minutes=${APPLE_JWT_EXPIRATION_MINUTES}
      - AWS_ACCESS_KEY=${AWS_ACCESS_KEY}
      - AWS_SECRET_KEY=${AWS_SECRET_KEY}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - AWS_REGION=${AWS_REGION}
    volumes:
      - ${APPLE_PRIVATE_KEY_PATH}:/app/AuthKey_BR37FCMBWW.p8

volumes:
  mysql_data:

networks:
  habitlog-network:
    driver: bridge
