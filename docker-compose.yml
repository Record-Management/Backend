version: '3.8'

services:
  habitlog-db:
    image: mysql:8.0
    container_name: habitlog-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - habitlog-network

  habitlog-app:
    build: .
    container_name: habitlog-app
    restart: always
    ports:
      - "8082:8082"
    depends_on:
      - habitlog-db
    networks:
      - habitlog-network
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=${SERVER_PORT}
      - SPRING_DATASOURCE_URL=jdbc:mysql://habitlog-db:3306/${DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=com.mysql.cj.jdbc.Driver
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      - SPRING_JPA_SHOW_SQL=true
      - SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=org.hibernate.dialect.MySQLDialect
      - SPRING_FLYWAY_BASELINE_ON_MIGRATE=true
      - SPRING_FLYWAY_BASELINE_VERSION=1
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_TOKEN_EXPIRE_TIME=${JWT_ACCESS_TOKEN_EXPIRE_TIME}
      - JWT_REFRESH_TOKEN_EXPIRE_TIME=${JWT_REFRESH_TOKEN_EXPIRE_TIME}
      - OAUTH_KAKAO_REST_API_KEY=${KAKAO_CLIENT_REST_API_KEY}
      - OAUTH_KAKAO_ADMIN_KEY=${KAKAO_ADMIN_KEY}
      - SOCIAL_APPLE_TEAM_ID=${APPLE_TEAM_ID}
      - SOCIAL_APPLE_BUNDLE_ID=${APPLE_BUNDLE_ID}
      - SOCIAL_APPLE_KEY_ID=${APPLE_KEY_ID}
      - SOCIAL_APPLE_SERVICE_ID=${APPLE_SERVICE_ID}
      - SOCIAL_APPLE_PRIVATE_KEY_PATH=${APPLE_PRIVATE_KEY_PATH}
      - SOCIAL_APPLE_JWT_EXPIRATION_MINUTES=${APPLE_JWT_EXPIRATION_MINUTES}
      - AWS_ACCESS_KEY=${AWS_ACCESS_KEY}
      - AWS_SECRET_KEY=${AWS_SECRET_KEY}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - AWS_REGION=${AWS_REGION}
    volumes:
      - ${APPLE_PRIVATE_KEY_PATH}:/app/AuthKey_BR37FCMBWW.p8

volumes:
  mysql_data:

networks:
  habitlog-network:
    driver: bridge
