name: Deploy to EC2

on:
  push:
    branches: [ main ]
  # PR에서는 배포하지 않음

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.EC2_SSH_KEY }}" | base64 -d > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keygen -l -f ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts || true
        
    - name: Deploy to EC2
      timeout-minutes: 15
      run: |
        # 배포 스크립트를 단계별로 실행
        ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=60 -o ServerAliveCountMax=10 jeonwooseon@${{ secrets.EC2_HOST }} << 'EOF'
          set -e  # 에러 시 즉시 중단
          
          echo "=== 배포 시작: $(date) ==="
          
          echo "1. 코드 업데이트 중..."
          cd Backend
          git fetch origin
          git reset --hard origin/main
          
          echo "2. Firebase 설정 파일 생성 중..."
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > src/main/resources/firebase-service-account.json
          
          echo "3. 기존 컨테이너 중지 중..."
          docker-compose down || true
          
          echo "4. Docker 이미지 빌드 중..."
          nohup docker-compose build --no-cache --progress=plain > build.log 2>&1 &
          BUILD_PID=$!
          
          # 빌드 상태를 주기적으로 체크
          while kill -0 $BUILD_PID 2>/dev/null; do
            echo "빌드 진행 중... ($(date))"
            sleep 30
          done
          wait $BUILD_PID
          
          echo "빌드 완료. 로그 확인:"
          tail -20 build.log
          
          echo "5. 컨테이너 시작 중..."
          docker-compose up -d
          
          echo "6. 배포 상태 확인 중..."
          sleep 10
          docker-compose ps
          
          echo "7. Docker 정리 중..."
          chmod +x scripts/docker-cleanup.sh
          ./scripts/docker-cleanup.sh
          
          echo "=== 배포 완료: $(date) ==="
        EOF
