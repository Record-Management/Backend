name: Deploy to EC2

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.EC2_SSH_KEY }}" | base64 -d > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keygen -l -f ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts || true
        
    - name: Deploy to EC2
      timeout-minutes: 10
      run: |
        # SSH 연결 재시도 로직
        for i in {1..3}; do
          echo "배포 시도 $i/3..."
          if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 ec2-user@${{ secrets.EC2_HOST }} "cd Backend && git pull origin main && docker-compose down && docker-compose build && docker-compose up -d && echo '배포 완료: $(date)'"; then
            echo "배포 성공!"
            break
          else
            echo "배포 실패, 30초 후 재시도..."
            if [ $i -lt 3 ]; then
              sleep 30
            fi
          fi
        done
