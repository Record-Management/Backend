name: Deploy to EC2

on:
  push:
    branches: [ main ]
  # PR에서는 배포하지 않음

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.EC2_SSH_KEY }}" | base64 -d > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keygen -l -f ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts || true
        
    - name: Deploy to EC2
      timeout-minutes: 15
      run: |
        # 배포 스크립트를 단계별로 실행
        ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 ec2-user@${{ secrets.EC2_HOST }} << 'EOF'
          set -e  # 에러 시 즉시 중단
          
          echo "=== 배포 시작: $(date) ==="
          
          echo "1. 코드 업데이트 중..."
          cd Backend
          git fetch origin
          git reset --hard origin/main
          
          echo "2. 기존 컨테이너 중지 중..."
          docker-compose down || true
          
          echo "3. Docker 이미지 빌드 중..."
          docker-compose build --no-cache
          
          echo "4. 컨테이너 시작 중..."
          docker-compose up -d
          
          echo "5. 배포 상태 확인 중..."
          sleep 10
          docker-compose ps
          
          echo "=== 배포 완료: $(date) ==="
        EOF
