name: Deploy to EC2

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        echo "SSH key file size: $(wc -c ~/.ssh/id_rsa)"
        echo "SSH key first line: $(head -1 ~/.ssh/id_rsa)"
        echo "SSH key last line: $(tail -1 ~/.ssh/id_rsa)"
        ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts || true
        
    - name: Deploy to EC2
      run: |
        ssh -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
          cd Backend
          git pull origin main
          docker-compose down
          docker-compose build --no-cache
          docker-compose up -d
          echo "배포 완료: $(date)"
        EOF